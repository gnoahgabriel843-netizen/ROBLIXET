function wsURL(){if(S.srv)return S.srv;if(!window.claude&&/^https?:$/.test(location.protocol)&&location.host)return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';return null;}
function wsConnect(url,code){return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(url);}catch(e){return rej(e);}const to=setTimeout(()=>{try{ws.close();}catch(e){}rej(new Error('timeout'));},5000);
 const rm={ws,my:null,pm:{},cbs:[],peers(){return Object.keys(this.pm).map(id=>({peer:id,presence:this.pm[id],isMe:id===this.my,sameTab:id===this.my,kind:'viewer'}));},presence(d){if(ws.readyState===1)ws.send(JSON.stringify({t:'p',d}));},onPeers(cb){this.cbs.push(cb);return()=>{this.cbs=this.cbs.filter(f=>f!==cb);};},leave(){try{ws.close();}catch(e){}}};
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:code}));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}if(m.t==='welcome'){rm.my=m.id;clearTimeout(to);res(rm);}else if(m.t==='snap'){rm.pm=m.peers;rm.cbs.forEach(f=>f({peers:rm.peers()}));}else if(m.t==='full'){clearTimeout(to);rej(new Error('full'));}};
 ws.onclose=()=>{rm.pm={};rm.cbs.forEach(f=>f({peers:[]}));};ws.onerror=()=>{clearTimeout(to);rej(new Error('ws'));};});}
async function mpJoin(code){code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(!code)return;mpLeave();let rm=null;const u=wsURL();
 if(u){try{rm=await wsConnect(u,'g'+code);}catch(e){}}if(!rm&&roomL){try{rm=await roomL.join('g-'+code);}catch(e){}}
 if(!rm){smsg(tr(['Aucun serveur joignable — joue avec des bots','No server reachable — play with bots','Sin servidor — juega con bots']));return;}
 mp2={code,rm,started:0};rm.presence({n:S.nm,sk:S.eq.c,pk:S.eq.p,gs:S.eq.g,gl:S.eq.l});mp2.un=rm.onPeers(()=>mpUpdate());mpUpdate();}
function mpLeave(){if(mp2){clearInterval(mp2.qt);clearTimeout(mp2.qw);try{mp2.un&&mp2.un();mp2.rm.leave();}catch(e){}mp2=null;}renderMulti();}

 if(t<=0){clearInterval(mp2.qt);if(ps.length<2){mpLeave();botsPlay();}else{const host=ps.slice().sort((a,b)=>a.peer<b.peer?-1:1)[0];if(host.isMe)mp2.rm.presence({go:1+Math.floor(Math.random()*1e9)});else mp2.qw=setTimeout(()=>{if(mp2&&!mp2.started){mpLeave();botsPlay();}},8000);}}},1000);}

function hbLane(a,b){let worst=0;for(const o of HB.P){if(o.t===a.t)continue;const dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz)||1,t=hbC(((o.x-a.x)*dx+(o.z-a.z)*dz)/(L*L),0,1),px=a.x+dx*t,pz=a.z+dz*t,d=Math.hypot(o.x-px,o.z-pz);if(d<1.0)worst=Math.max(worst,1-d);}return worst;}

 if(Math.random()<pr){B.own=null;h.ball=0;B.mode='free';B.free=1;B.vx=Math.sin(d.face)*3+h.vx*.4;B.vz=Math.cos(d.face)*3+h.vz*.4;B.vy=2;B.noCatch=.12;B.last=h;B.lastT=h.t;hbStat(d).stl++;hbMsg('🖐️ VOLÉ !',d.pl.n,1.2);HB.E+=.4;h.st='stun';h.tt=.4;if(d.t===0)hbSetCtl(d);}

function hbPts(type){const H=HB;if(H.cfg.mode==='street')return type==='three'?2:1;if(H.cfg.mode==='3pt')return(H.ctc&&H.ctc.k%5===4)?2:1;return type==='three'?3:type==='ft'?1:2;}
function hbMove(p,dt,ix,iz,run,faceTo,slow){const a=p.pl.a,len=Math.hypot(ix,iz),k=len>1?1/len:1;let mx=(3.3+a.spd*.036)*(p.ball?.95:1)*(p.st==='defend'?.93:1)*(slow||1)*(1-(1-p.stam)*.18);const spr=run&&p.stam>.04&&len>.3;if(spr){mx*=1.28;p.stam=Math.max(0,p.stam-dt*.11);}
 if(p.st==='stun')mx*=.35;if(p.st==='reach')mx*=.5;if(p.burst>0){mx*=1.3;p.burst-=dt;}
 const f=Math.min(1,len),tx=ix*k*mx*f,tz=iz*k*mx*f,ac=(len>.05?17:12)*dt;let dx=tx-p.vx,dz=tz-p.vz;const dl=Math.hypot(dx,dz);if(dl>ac){dx*=ac/dl;dz*=ac/dl;}p.vx+=dx;p.vz+=dz;const sp=Math.hypot(p.vx,p.vz);
 if(faceTo!==undefined){const d=hbAng(p.face,faceTo);p.face+=d*Math.min(1,dt*10);p.turn+=(0-p.turn)*.2;}else if(sp>.5){const fa=Math.atan2(p.vx,p.vz),d=hbAng(p.face,fa);p.face+=d*Math.min(1,dt*(p.ball?8:11));p.turn+=(hbC(d,-1,1)-p.turn)*.2;}else p.turn*=.9;
 if(!spr)p.stam=Math.min(1,p.stam+dt*(sp<1.5?.05:.008));p.x=hbC(p.x+p.vx*dt,-HL+.15,HL-.15);p.z=hbC(p.z+p.vz*dt,-HW+.15,HW-.15);}
function hbDunkFinish(p){const B=HB.B,h=hbHoop(p.t);p.ball=0;B.own=null;B.mode='shot';B.free=0;B.scored=0;B.rimmed=0;B.age=0;B.pass=null;B.x=h.x;B.z=h.z;B.y=RIMY+.2;B.vx=B.vz=0;B.vy=-4;B.shot={p,t:p.t,type:'dunk',pts:hbPts('dunk'),make:true,q:'perfect',T:.3,age:0,res:0,nfa:2};hbStat(p).fga++;p.dunkFin=1;p.rel=1;B.last=p;B.lastT=p.t;}
function hbJumpReb(p){if(p.cd>0||['shoot','dunk','block','rebound'].includes(p.st))return;p.st='rebound';p.jT=0;p.cd=.9;}
function hbStTick(p,dt,H){const B=H.B;p.cd=Math.max(0,p.cd-dt);const st=p.st;
 if(st==='shoot'){p.shT+=dt;const lay=p.shType==='layup',dur=lay?.85:1.0,u=Math.min(1,p.shT/dur);p.y=(lay?.55:.5)*4*u*(1-u);if(!p.rel){if(lay){if(p.shT>=.4)hbRelease(p,Math.random()<.3?'perfect':'good');}else if(!p.human&&p.shT>=p.aiRel)hbRelease(p,p.aiQ);}if(p.shT>=dur){p.st='idle';p.y=0;p.rel=0;}}
 else if(st==='dunk'){p.dT=(p.dT||0)+dt;if(!p.dunkFin){const u=Math.min(1,p.dT/.75);const e=Math.min(1,u*1.4);p.x=p.dx0+(p.dtx-p.dx0)*e;p.z=p.dz0+(p.dtz-p.dz0)*e;p.y=1.0*Math.sin(Math.min(1,u*1.1)*Math.PI*.9);p.face=Math.atan2(p.dtx<0?-1:1,0);p.vx=p.vz=0;if(u>=.55)hbDunkFinish(p);}else{p.dT2=(p.dT2||0)+dt;p.y=Math.max(0,p.y-dt*3.2);if(p.y<=0&&p.dT2>.5){p.st='cel';p.tt=.9;p.dunkFin=0;p.rel=0;p.y=0;}}}
 else if(st==='block'||st==='rebound'){p.jT+=dt;const dur=st==='block'?.62:.6,u=Math.min(1,p.jT/dur);p.y=(st==='block'?.75:.65)*4*u*(1-u)*(1+(p.pl.a.dnk-60)*.004);if(st==='block')hbBlockCheck(p);if(p.jT>=dur){p.st='idle';p.y=0;}}
 else if(st==='reach'||st==='pass'||st==='stun'||st==='fake'||st==='cel'){p.tt-=dt;if(p.tt<=0)p.st='idle';}
 if(p.oop){const o=p.oop;o.t+=dt;if(p.st!=='dunk'){hbMove(p,dt,o.x-p.x,o.z-p.z,1);}if(B.mode==='pass'&&B.pass&&B.pass.oop&&Math.hypot(B.x-p.x,B.z-p.z)<2.2){if(p.st!=='dunk'){p.st='dunk';p.dT=.2;p.dunkFin=1;p.dT2=-5;p.y=0;p.oopJ=1;}p.y=Math.min(1,p.y+dt*5);if(B.y<3.4&&Math.hypot(B.x-p.x,B.z-p.z)<1.1){p.oop=null;p.oopJ=0;hbDunkFinish(p);hbSnd('slam');H.shake=.4;}}else if(o.t>o.T+1.4){p.oop=null;if(p.st==='dunk'){p.st='idle';p.dunkFin=0;}p.y=0;}}
 if(p.st==='idle'||p.st==='defend'){p.y=0;p.st=(B.own&&B.own.t!==p.t&&H.ph==='play')?'defend':'idle';}}
function hbAIShot(p){const H=HB,type=hbShotType(p);hbStartShot(p,type);const diff=H.cfg.diff,sk=type==='three'?p.pl.a.tp:p.pl.a.mid,e=(Math.random()-.5)*2*(.1-diff*.022-(sk-60)*.0006);p.aiRel=.51+e;const ae=Math.abs(e);p.aiQ=ae<.022?'perfect':ae<.055?'good':e<0?'early':'late';if(type==='dunk'||type==='layup')p.aiRel=9;}
function hbAIHandler(p,dt,H){const B=H.B,h=hbHoop(p.t),sg=Math.sign(h.x),d=Math.hypot(h.x-p.x,p.z),n=hbNearOpp(p),diff=H.cfg.diff;if(p.st==='shoot'||p.st==='dunk')return;if(p.st==='stun'||p.st==='pass'){hbMove(p,dt,0,0,0);return;}
 if(H.clear){const out=Math.hypot(h.x-p.x,p.z);if(out<TPR+.4){const ang=Math.atan2(p.z,p.x-h.x);hbMove(p,dt,-sg*.8,-Math.sign(p.z||1)*.3,0);return;}H.clear=0;}
 p.dec-=dt;if(p.dec<=0){p.dec=hbC(.55-diff*.1+Math.random()*.25,.2,1);p.act=null;const q=hbProb(p,hbShotType(p),'good');const behind=p.x*sg>HXX+.2;const near=d<3.3&&n.d>.8&&!behind;

 const act=p.act;if(act==='shoot'){if(p.st==='idle'||p.st==='defend')hbAIShot(p);p.act=null;}
 else if(act==='pass'&&p.actT){const lob=d>2.5&&hbD(p.actT,hbHoop(p.t))<4.5&&p.actT.pl.a.dnk>=66&&Math.random()<.5;p.face=Math.atan2(p.actT.x-p.x,p.actT.z-p.z);hbDoPass(p,p.actT,lob);p.act=null;p.dec=.6;}
 else if(act==='drive'){const tx=h.x-sg*1.2,tz=p.dr*Math.min(2,d*.25);hbMove(p,dt,tx-p.x,tz-p.z,n.d>1.6&&p.stam>.3);if(d<3.2&&p.x*sg<HXX-.2){p.act='shoot';p.dec=0;}}
 else{const ang=Math.atan2(p.z,p.x-h.x)+(p.dr||1)*dt*.6,r=TPR+.5;const tx=h.x+Math.cos(ang)*r*(sg<0?1:1),tz=Math.sin(ang)*r;hbMove(p,dt,(h.x-(h.x-p.x)+(tx-p.x)),(tz-p.z),0);}
 if(Math.random()<dt*.35)p.hand*=-1;}
function hbAIOff(p,dt,H){const B=H.B,sp=hbSpots(p.t)[p.k]||hbSpots(p.t)[0],h=hbHoop(p.t),sg=Math.sign(h.x);p.cutT=(p.cutT||0)-dt;if(p.cutT<-3-Math.random()*3&&p.pl.pos!=='C'&&p.k!==0){p.cutT=1.4;}let tx=sp[0],tz=sp[1];if(p.cutT>0){tx=h.x-sg*1.3;tz=(p.k%2?-1:1)*1.6;}
 if(p.st==='stun'||p.st==='shoot'||p.st==='dunk'||p.oop)return;if(H.clear&&p.t===H.poss){tx=h.x-sg*8.4;}const dx=tx-p.x,dz=tz-p.z;hbMove(p,dt,Math.abs(dx)<.35&&Math.abs(dz)<.35?0:dx,Math.abs(dx)<.35&&Math.abs(dz)<.35?0:dz,hbD(p,{x:tx,z:tz})>5,B.own?Math.atan2(B.own.x-p.x,B.own.z-p.z):undefined);}
function hbAIDef(p,dt,H){const B=H.B,m=p.mark||H.P.find(o=>o.t!==p.t),mh=hbHoop(1-p.t),own=B.own;if(!m)return;if(p.st==='stun'||p.st==='shoot'||p.st==='dunk'||p.st==='block'||p.st==='rebound'||p.st==='reach'&&0)return;const diff=H.cfg.diff;
 const bx=own?own.x:B.x,bz=own?own.z:B.z,dball=Math.hypot(m.x-bx,m.z-bz);let gap=m===own?.95+(1-diff*.1)*.1:dball<6?1.5:2.3;const ux=mh.x-m.x,uz=mh.z-m.z,ul=Math.hypot(ux,uz)||1;let tx=m.x+ux/ul*gap,tz=m.z+uz/ul*gap;
 if(own&&own!==m&&Math.hypot(own.x-mh.x,own.z)<5.5&&Math.hypot(m.x-bx,m.z-bz)>4&&hbD(p,{x:mh.x,z:0})<6){tx=mh.x-Math.sign(mh.x)*1.9;tz=own.z*.4;}
 hbMove(p,dt,tx-p.x,tz-p.z,hbD(p,{x:tx,z:tz})>2.2,Math.atan2(bx-p.x,bz-p.z),.96+diff*.02);
 if(own&&m===own&&hbD(p,own)<1.25&&p.cd<=0&&Math.random()<dt*(.08+diff*.1)&&H.ph==='play')hbSteal(p);
 if(B.mode==='shot'&&B.shot&&B.shot.t!==p.t&&B.age<.2&&hbD(p,B.shot.p)<1.6&&p.cd<=0&&Math.random()<.35+diff*.18)hbBlock(p);
 if(own&&own.st==='fake'&&hbD(p,own)<2&&Math.random()<.25&&p.cd<=0){hbBlock(p);}}
function hbAILoose(p,dt,H){const B=H.B;let near=null,bd=1e9;for(const o of H.P){if(o.t!==p.t)continue;const d=Math.hypot(o.x-B.x,o.z-B.z);if(d<bd){bd=d;near=o;}}
 const inAir=B.mode==='shot'&&!B.free;if(B.mode==='pass'&&B.pass){if(p.t===B.pass.from.t){const tg=B.pass.to;if(p===tg&&!tg.oop)hbMove(p,dt,B.x-p.x+B.vx*.2,B.z-p.z+B.vz*.2,1);else hbAIOff(p,dt,H);}else hbAIDef(p,dt,H);return;}
 const lx=B.x+B.vx*.25,lz=B.z+B.vz*.25;if(inAir&&B.shot){const h=hbHoop(B.shot.t),off=p.t===B.shot.t;if(hbD(p,{x:h.x,z:0})<5.2&&(p.pl.pos==='C'||p.pl.pos==='PF'||p.k>2||!off)){const tx=h.x-Math.sign(h.x)*(1.1+((p.k*.37)%1)*1.2),tz=((p.k%3)-1)*1.2;hbMove(p,dt,tx-p.x,tz-p.z,0,Math.atan2(h.x-p.x,0-p.z));if(B.y>2.4&&hbD(p,{x:B.x,z:B.z})<1.5)hbJumpReb(p);return;}if(off)hbAIOff(p,dt,H);else hbAIDef(p,dt,H);return;}
 if(p===near&&!p.human){hbMove(p,dt,lx-p.x,lz-p.z,1);if(B.y>2.2&&bd<1.4)hbJumpReb(p);}else{const near2=H.P.filter(o=>o.t===p.t).sort((a,b)=>Math.hypot(a.x-B.x,a.z-B.z)-Math.hypot(b.x-B.x,b.z-B.z))[1];if(p===near2&&bd<8)hbMove(p,dt,lx-p.x,lz-p.z,0);else if(H.poss===p.t)hbAIOff(p,dt,H);else hbAIDef(p,dt,H);}}

function hbHuman(p,inp,dt,H){const B=H.B;let ix=inp.ix,iz=inp.iz;if(H.cfg.mode==='3pt'){ix=iz=0;}
 const busy=p.st==='shoot'||p.st==='dunk'||p.st==='block'||p.st==='rebound'||p.st==='ft'||p.oop;
 if(p.ball&&B.own===p){
  if(inp.shootP&&(p.st==='idle'||p.st==='defend')&&H.ph==='play'){if(H.clear){hbMsg('Sors derrière l\'arc','',1.2);}else{hbStartShot(p);p.hold=0;}}
  if(p.st==='shoot'&&p.shType!=='layup'&&!p.rel){p.hold=(p.hold||0)+dt;const m=hbC(p.shT/.62,0,1);if(inp.shootR||m>=1){const g=.82,dd=Math.abs(m-g);let q;if(p.hold<.14){q=Math.random()<.45?'good':'bad';}else q=dd<.04+(p.pl.a.tp-60)*.0004?'perfect':dd<.1?'good':m<g?'early':'late';hbRelease(p,q);}}
  if(inp.passP&&H.ph==='play'&&!busy){const tg=hbBestPass(p,ix,iz,'h');if(tg){p.face=Math.atan2(tg.x-p.x,tg.z-p.z);hbDoPass(p,tg,inp.lob);}}
  if(inp.lobP&&!busy){const tg=hbBestPass(p,ix,iz,'h');if(tg){p.face=Math.atan2(tg.x-p.x,tg.z-p.z);hbDoPass(p,tg,true);}}
  if(inp.crossP&&!busy){p.hand*=-1;p.burst=.28;}if(inp.fakeP&&!busy&&p.st!=='fake'){p.st='fake';p.tt=.35;}}
 else if(B.own&&B.own.t===p.t){if((inp.passP||inp.lobP)&&H.ph==='play'){H.call=p;H.callT=1.8;hbMsg('Appel de balle','',.6);}}
 else if(B.own&&B.own.t!==p.t){if(inp.passP&&H.ph==='play')hbSteal(p);if(inp.shootP&&H.ph==='play')hbBlock(p);}
 else if(!B.own&&!busy&&inp.shootP&&H.ph==='play'){if(B.shot&&B.shot.t!==p.t&&B.age<.5)hbBlock(p);else hbJumpReb(p);}

 const faceTo=(B.own&&B.own.t!==p.t&&!inp.run&&p.st==='defend')?Math.atan2(B.own.x-p.x,B.own.z-p.z):undefined;hbMove(p,dt,ix,iz,inp.run,faceTo);}
function hbSwitch(manual){const H=HB,B=H.B;const ref=B.own&&B.own.t===1?B.own:B;let best=null,bd=1e9;for(const o of H.T[0]){if(o===H.ctl&&manual)continue;const d=Math.hypot(o.x-ref.x,o.z-ref.z);if(d<bd){bd=d;best=o;}}if(best&&best!==H.ctl){hbSetCtl(best);H.ctlLock=manual?1.2:.35;}}
function hbAutoSw(dt){const H=HB,B=H.B;H.ctlLock-=dt;if(H.ctlLock>0||H.half&&H.n===1)return;if(B.own&&B.own.t===0){if(H.ctl!==B.own&&!H.ctl.oop)hbSetCtl(B.own);return;}if(!H.ctl||H.ctl.st==='shoot'||H.ctl.st==='dunk')return;const ref=B.own?B:B;let best=null,bd=1e9;for(const o of H.T[0]){const d=Math.hypot(o.x-ref.x,o.z-ref.z);if(d<bd){bd=d;best=o;}}if(best&&best!==H.ctl&&Math.hypot(H.ctl.x-ref.x,H.ctl.z-ref.z)>bd+1.2)hbSetCtl(best);}

  case'ft':{for(const p of H.P){if(p!==H.ft.p){hbStTick(p,dt,H);hbMove(p,dt,0,0,0);}}hbStTick(H.ft.p,dt,H);hbFTTick(dt);hbBall(dt);break;}

function rpSnd(n,v){v=v===undefined?1:v;const m={shot(){tn(220,60,.1,'square',.28*v);nz(.08,1800,400,1,'bandpass',.3*v);},shotgun(){tn(120,40,.2,'sawtooth',.4*v);nz(.2,900,200,1,'lowpass',.5*v);},punch(){tn(130,55,.11,'sine',.45*v);},hit(){nz(.05,900,300,1,'lowpass',.3*v);},horn(){tn(420,420,.35,'square',.18*v);tn(520,520,.35,'square',.14*v);},cash(){tn(1300,1700,.1,'triangle',.25);},siren(){tn(700,1000,.35,'sawtooth',.1*v);},crash(){nz(.25,700,150,1,'lowpass',.45*v);},ping(){tn(900,1300,.1,'triangle',.2);},door(){tn(160,100,.1,'square',.2);}};try{(m[n]||(()=>{}))();}catch(e){}}

function rpSpawnCar(kind,x,z,yaw,drv,col){const D=RPCARS[kind],mk=rpMkCar(kind,col===undefined?rpPick(D.cols):col);RPG.sc.add(mk.g);const c={k:kind,mk,x,z,yaw,sp:0,st:0,hp:100,drv,vt:8+Math.random()*4,from:0,to:0,stuck:0,spec:D,t:0,blink:0,own:0,occ:null,smoke:0};RPG.cars.push(c);return c;}
function rpNearNode(x,z){let b=0,bd=1e9;RPG.nodes.forEach((n,i)=>{const d=Math.hypot(n.x-x,n.z-z);if(d<bd){bd=d;b=i;}});return b;}
function rpLaneT(a,b,off){const A=RPG.nodes[a],B=RPG.nodes[b],dx=B.x-A.x,dz=B.z-A.z,l=Math.hypot(dx,dz)||1,fx=dx/l,fz=dz/l;return{x:B.x+(-fz)*off,z:B.z+fx*off,fx,fz};}
function rpSpawnTraffic(){const P=RPG.p;let n,tries=0;do{n=Math.floor(Math.random()*RPG.nodes.length);tries++;}while(tries<20&&Math.hypot(RPG.nodes[n].x-P.x,RPG.nodes[n].z-P.z)<90);const A=RPG.nodes[n],nb=rpPick(A.nb),lt=rpLaneT(n,nb,3.6),kind=rpPick(['sedan','sedan','suv','sport','sedan','taxi']);const t=.15+Math.random()*.5,x=A.x+(RPG.nodes[nb].x-A.x)*t+(-lt.fz)*3.6,z=A.z+(RPG.nodes[nb].z-A.z)*t+lt.fx*3.6;const c=rpSpawnCar(kind,x,z,Math.atan2(lt.fx,lt.fz),'npc');c.from=n;c.to=nb;return c;}
function rpCarStep(c,dt,inp){const D=c.spec,fwd=c.sp>=0?1:-1;let acc=0;if(c.hp<=0){inp={gas:0,brk:1,steer:0,hb:0};}
 if(inp.gas>0)acc+=D.acc*inp.gas*(c.sp<D.v?1:0)*(c.sp<0?2.5:1);if(inp.brk>0){if(c.sp>.5)acc-=D.acc*1.8*inp.brk;else acc-=D.acc*.55*inp.brk*(c.sp>-D.v*.3?1:0);}
 acc-=Math.sign(c.sp)*(.8+Math.abs(c.sp)*.05);if(inp.hb)acc-=Math.sign(c.sp)*14;c.sp+=acc*dt;if(Math.abs(c.sp)<.15&&!inp.gas&&!inp.brk)c.sp=0;
 const ts=inp.steer*(.62-Math.min(.42,Math.abs(c.sp)/D.v*.45));c.st+=(ts-c.st)*Math.min(1,dt*7);const yr=c.sp/(D.L*.62)*Math.tan(c.st)*(inp.hb&&Math.abs(c.sp)>8?1.7:1);c.yaw+=yr*dt;
 c.x+=Math.sin(c.yaw)*c.sp*dt;c.z+=Math.cos(c.yaw)*c.sp*dt;
 // collisions : 3 cercles le long de la voiture
 let imp=0;for(const o of[-D.L*.3,0,D.L*.3]){const q={x:c.x+Math.sin(c.yaw)*o,z:c.z+Math.cos(c.yaw)*o};const i=rpPush(q,.95,.5);if(i>0){c.x+=q.x-(c.x+Math.sin(c.yaw)*o);c.z+=q.z-(c.z+Math.cos(c.yaw)*o);imp=Math.max(imp,i);}}
 if(imp>0){const s=Math.abs(c.sp);if(s>4){c.hp-=s*1.6;if(c===RPG.p.car){RPG.shk=Math.min(1,s/25);rpSnd('crash',Math.min(1,s/20));}}c.sp*=.35;}
 c.t+=dt;}
function rpCarCar(a,b){const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),r=3.0;if(d<r&&d>1e-4){const p=(r-d)*.5;a.x-=dx/d*p;a.z-=dz/d*p;b.x+=dx/d*p;b.z+=dz/d*p;const s=Math.abs(a.sp)+Math.abs(b.sp);if(s>5){a.hp-=s*.7;b.hp-=s*.7;if(a===RPG.p.car||b===RPG.p.car){RPG.shk=.5;rpSnd('crash');}if(a.drv==='npc'||b.drv==='npc'){const o=a.drv==='npc'?a:b;if(o.sp>0)o.sp*=.3;}}a.sp*=.7;b.sp*=.7;}}
function rpTrafficAI(c,dt){const lt=rpLaneT(c.from,c.to,3.6),dx=lt.x-c.x,dz=lt.z-c.z,dist=Math.hypot(dx,dz);if(dist<8){const pf=c.from;c.from=c.to;const nb=RPG.nodes[c.to].nb.filter(n=>n!==pf);c.to=rpPick(nb.length?nb:RPG.nodes[c.to].nb);}
 const want=Math.atan2(dx,dz),de=rpAng(c.yaw,want);let vt=Math.abs(de)>.7?5:c.vt;const fx=Math.sin(c.yaw),fz=Math.cos(c.yaw);
 for(const o of RPG.cars){if(o===c)continue;const ox=o.x-c.x,oz=o.z-c.z,f=ox*fx+oz*fz,s=Math.abs(ox*fz-oz*fx);if(f>0&&f<13&&s<2.4)vt=Math.min(vt,Math.max(0,(f-5)*.8));}
 const pp=RPG.p;if(!pp.car){const ox=pp.x-c.x,oz=pp.z-c.z,f=ox*fx+oz*fz,s=Math.abs(ox*fz-oz*fx);if(f>0&&f<9&&s<2.2)vt=0;}for(const q of RPG.peds){if(q.hp<=0)continue;const ox=q.x-c.x,oz=q.z-c.z,f=ox*fx+oz*fz,s=Math.abs(ox*fz-oz*fx);if(f>0&&f<8&&s<1.8){vt=0;break;}}
 if(c.stuck>2.5){c.sp=-3;c.stuck=0;}if(Math.abs(c.sp)<.4&&vt>1)c.stuck+=dt;else c.stuck=0;
 rpCarStep(c,dt,{gas:c.sp<vt?1:0,brk:c.sp>vt+1.5?1:0,steer:rpC(de*1.6,-1,1),hb:0});}

function rpSpawnPed(){const P=RPG.p;let i,j,tries=0,x,z;do{i=Math.floor(Math.random()*4);j=Math.floor(Math.random()*4);const bx=(RPRC[i]+RPRC[i+1])/2,bz=(RPRC[j]+RPRC[j+1])/2;x=bx+(Math.random()<.5?-31.5:31.5);z=bz+(Math.random()-.5)*60;tries++;}while(tries<20&&Math.hypot(x-P.x,z-P.z)<40);
 const m=rpMkPed(rpRandOutfit());m.rotation.order='YXZ';RPG.sc.add(m);const q={m,j:m.userData.j,x,z,yaw:0,hp:50,i,j2:j,state:'walk',sp:1.3+Math.random()*.4,tx:x,tz:z,ph:Math.random()*6,t:0,dead:0,flee:0,cop:0,side:Math.random()<.5?1:-1};q.m.position.set(x,0,z);RPG.peds.push(q);rpPedNext(q);return q;}
function rpPedNext(q){const bx=(RPRC[q.i]+RPRC[q.i+1])/2,bz=(RPRC[q.j2]+RPRC[q.j2+1])/2,h=31.5;const dx=q.x-bx,dz=q.z-bz;let tx,tz;if(Math.abs(dx)>Math.abs(dz)){tx=Math.sign(dx)*h;tz=rpC(dz+q.side*20,-h,h);}else{tz=Math.sign(dz)*h;tx=rpC(dx+q.side*20,-h,h);}if(Math.abs(tx)>=h-.1&&Math.abs(tz)>=h-.1&&Math.random()<.35){const ni=rpC(q.i+(tx>0?1:-1),0,3),nj=q.j2;if(ni!==q.i){q.i=ni;tx=-tx;}}if(Math.random()<.15)q.side*=-1;q.tx=bx+tx;q.tz=bz+tz;}

function rpPose(e,dt,sp,st){const j=e.j;e.ph=(e.ph||0)+dt*(2+sp*1.6);const a=Math.sin(e.ph),k=Math.min(1,sp/5.5);let hl=a*.9*k,hr=-a*.9*k,kl=Math.max(0,-Math.cos(e.ph))*.9*k+.04,kr=Math.max(0,Math.cos(e.ph))*.9*k+.04,sl=-a*.8*k,sr=a*.8*k,el=-.15-.5*k,er=el,lean=.08*k,hy=.98,sz=0;
 if(st==='aim'){sl=-.5;el=-1.0;sr=-1.5;er=-.12;lean=.04;}if(st==='punch'){const u=Math.sin(Math.min(1,e.punchT/.28)*Math.PI);sr=-1.1-.6*u;er=-1.4+1.3*u;sl=-.6;el=-1.3;lean=.1+.1*u;}if(st==='drive'){hy=.66;hl=hr=-1.5;kl=kr=1.45;sl=sr=-.95;el=er=-.8;lean=-.02;}
 if(st==='jump'){hl=-.7;hr=.2;kl=.9;kr=.3;sl=sr=-2.3;el=er=-.3;}if(st==='flee'){sl=-2.2;sr=-2.2;}if(st==='dead'){hl=hr=0;kl=kr=0;}
 j.hl.rotation.x=-hl;j.hr.rotation.x=-hr;j.kl.rotation.x=kl;j.kr.rotation.x=kr;j.sl.rotation.x=sl;j.sr.rotation.x=sr;j.el.rotation.x=er;j.er.rotation.x=el;j.sl.rotation.z=.08;j.sr.rotation.z=-.08;j.tor.rotation.x=lean;j.hip.position.y=hy-Math.abs(Math.sin(e.ph))*.025*k;e.m.rotation.x=st==='dead'?-1.5:0;}
// --- rayon et dégâts
function rpRayBox(o,d,c,top,maxT){let t0=0,t1=maxT;const lo=[c.x0,0,c.z0],hi=[c.x1,top,c.z1],oo=[o.x,o.y,o.z],dd=[d.x,d.y,d.z];for(let i=0;i<3;i++){if(Math.abs(dd[i])<1e-9){if(oo[i]<lo[i]||oo[i]>hi[i])return null;}else{let a=(lo[i]-oo[i])/dd[i],b=(hi[i]-oo[i])/dd[i];if(a>b){const t=a;a=b;b=t;}t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return null;}}return t0;}
function rpRaySph(o,d,cx,cy,cz,r){const lx=cx-o.x,ly=cy-o.y,lz=cz-o.z,t=lx*d.x+ly*d.y+lz*d.z;if(t<0)return null;const px=lx-d.x*t,py=ly-d.y*t,pz=lz-d.z*t,dd=px*px+py*py+pz*pz;if(dd>r*r)return null;return t-Math.sqrt(r*r-dd);}
function rpTrace(o,d,maxT,skip){let best={t:maxT,type:'none'};for(const c of rpQuery(o.x+d.x*maxT*.5,o.z+d.z*maxT*.5,maxT*.55)){const t=rpRayBox(o,d,c,c.h,best.t);if(t!==null&&t<best.t)best={t,type:'wall'};}
 if(d.y<0){const t=-o.y/d.y;if(t>0&&t<best.t)best={t,type:'ground'};}
 const ents=RPG.peds.concat(RPG.cops);for(const q of ents){if(q===skip||q.hp<=0)continue;const h=rpRaySph(o,d,q.x,1.62,q.z,.24);if(h!==null&&h<best.t)best={t:h,type:'ped',q,head:1};const b=rpRaySph(o,d,q.x,1.0,q.z,.5);if(b!==null&&b<best.t)best={t:b,type:'ped',q,head:0};}
 for(const c of RPG.cars){if(c===RPG.p.car)continue;const t=rpRaySph(o,d,c.x,.9,c.z,2.1);if(t!==null&&t<best.t)best={t,type:'car',c};}return best;}
function rpFx(x,y,z,col,n){if(RPG.fx.length>70)return;for(let i=0;i<(n||4);i++){const m=new T.Mesh(RPG.fxG,new T.MeshBasicMaterial({color:col||0xffd070,transparent:true}));m.position.set(x,y,z);RPG.sc.add(m);RPG.fx.push({m,vx:(Math.random()-.5)*3,vy:Math.random()*2.5,vz:(Math.random()-.5)*3,t:0});}}
function rpTracer(a,b){const g=new T.BufferGeometry().setFromPoints([new T.Vector3(a.x,a.y,a.z),new T.Vector3(b.x,b.y,b.z)]);const l=new T.Line(g,new T.LineBasicMaterial({color:0xffe9a0,transparent:true}));RPG.sc.add(l);RPG.fx.push({m:l,line:1,t:0});}
function rpCrime(lv,why){if(RPG.wanted<lv){RPG.wanted=Math.min(5,lv);rpNote('🚨 Recherché : '+'★'.repeat(RPG.wanted)+(why?' ('+why+')':''));}RPG.wT=0;}
function rpHurtPed(q,dmg,head,by){if(q.hp<=0)return;q.hp-=dmg*(head?3:1);q.flee=8;q.state='flee';rpSnd('hit');rpFx(q.x,1.2,q.z,0xaa1010,3);if(q.hp<=0){q.state='dead';q.dead=0;if(q.cop){rpCrime(Math.max(3,RPG.wanted+1),'policier abattu');RPG.money+=0;}else{rpCrime(1,'meurtre');if(Math.random()<.7){RPG.money+=Math.round(20+Math.random()*60);rpNote('+ argent trouvé');}}}else if(!q.cop)rpCrime(1,'agression');}
function rpShoot(P,cam){const w=RPW[P.wpn];if(P.cool>0||P.rel>0)return;if(P.wpn==='fists'){P.cool=w.cd;P.punchT=.001;rpSnd('punch');let b=null,bd=2.2;for(const q of RPG.peds.concat(RPG.cops)){if(q.hp<=0)continue;const d=rpD(q,P);if(d<bd&&Math.abs(rpAng(P.yaw,Math.atan2(q.x-P.x,q.z-P.z)))<.9){bd=d;b=q;}}if(b){rpHurtPed(b,w.dmg,0);b.hit=.3;}return;}
 if(P.mag[P.wpn]<=0){rpReload(P);return;}P.mag[P.wpn]--;P.cool=w.cd;rpSnd(P.wpn==='shotgun'?'shotgun':'shot');P.fire=.12;
 const o={x:cam.x,y:cam.y,z:cam.z},fx=RPG.camF;for(let p=0;p<w.pel;p++){const d={x:fx.x+(Math.random()-.5)*w.spread*2,y:fx.y+(Math.random()-.5)*w.spread*2,z:fx.z+(Math.random()-.5)*w.spread*2},l=Math.hypot(d.x,d.y,d.z);d.x/=l;d.y/=l;d.z/=l;const r=rpTrace(o,d,120,null),hp={x:o.x+d.x*r.t,y:o.y+d.y*r.t,z:o.z+d.z*r.t};rpTracer({x:P.x+Math.sin(P.yaw)*.5,y:1.4,z:P.z+Math.cos(P.yaw)*.5},hp);
  if(r.type==='ped'){rpHurtPed(r.q,w.dmg,r.head,P);}else if(r.type==='car'){r.c.hp-=w.dmg*.6;rpFx(hp.x,hp.y,hp.z,0xffd070,3);if(r.c.drv==='npc'&&r.c.hp>0){rpCrime(1,'tirs sur véhicule');}}else rpFx(hp.x,Math.max(.1,hp.y),hp.z,0xcccccc,3);}
 if(RPG.p.car===null)for(const q of RPG.peds){if(q.hp>0&&rpD(q,P)<28&&!q.cop){q.flee=Math.max(q.flee,6);q.state='flee';}}if(!P.noCrimeShot)rpCrime(RPG.cops.length||RPG.peds.some(q=>q.hp>0&&rpD(q,P)<25)?1:0,'coups de feu');if(P.mag[P.wpn]<=0)rpReload(P);}
function rpReload(P){const w=RPW[P.wpn];if(!w.mag||P.rel>0)return;const need=w.mag-P.mag[P.wpn],have=RPG.ammo[P.wpn];if(need<=0||have<=0)return;P.rel=1.4;P.relFor=Math.min(need,have);}

function rpPath(a,b){if(a===b)return[a];const prev={};prev[a]=-1;const q=[a];while(q.length){const n=q.shift();if(n===b)break;for(const m of RPG.nodes[n].nb){if(prev[m]===undefined){prev[m]=n;q.push(m);}}}const p=[];let c=b;while(c!==-1&&c!==undefined){p.unshift(c);c=prev[c];}return p;}
