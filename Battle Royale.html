<style>

.m .b.on{display:flex}.b.sel{background:#ffd23fcc;color:#111}
#bE{right:176px;bottom:152px;width:56px;height:56px}.row{display:flex;gap:8px;justify-content:center;margin:4px 0;flex-wrap:wrap}.opt{padding:10px 16px;border-radius:8px;background:#2a3040;font-size:15px;cursor:pointer}.opt.sel{background:#ffd23f;color:#111}

#bB{right:100px;bottom:110px;width:56px;height:56px}#bS{right:176px;bottom:84px;width:56px;height:56px}
#p1{right:22px;bottom:212px;width:56px;height:56px}#p2{right:90px;bottom:212px;width:56px;height:56px}#p3{right:158px;bottom:212px;width:56px;height:56px}
.b{transform:scale(var(--bs,1));opacity:var(--bo,1)}.b.pp{transform:translate(-50%,-50%) scale(var(--bs,1))}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:#0009;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:15;cursor:pointer}

#set h2{margin:0 0 6px;font-size:20px}#set label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:14px}

.layout #lay{display:flex}.layout .b{display:flex!important}.layout #ov{display:none!important}.layout .b{outline:2px dashed #ffd23f}

.lb:not(.layout) .b,.lb #hb,.lb #hud,.lb #zl,.lb #zr{display:none!important}.layout #lobby{display:none!important}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const mob=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
if(mob)document.body.classList.add('m');
// rendu
const rd=new T.WebGLRenderer({antialias:!mob});rd.setPixelRatio(Math.min(devicePixelRatio,mob?1.5:2));rd.setSize(innerWidth,innerHeight);
rd.shadowMap.enabled=true;rd.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(rd.domElement);
const sc=new T.Scene();
const sk=document.createElement('canvas');sk.width=2;sk.height=256;
sc.background=new T.CanvasTexture(sk);sc.fog=new T.Fog(0xcfe8ff,60,280);
const cam=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,400);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)});
sc.add(new T.HemisphereLight(0xffffff,0x6a8f55,.85));
const sun=new T.DirectionalLight(0xfff2d6,.8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:220});sc.add(sun,sun.target);
const gc=document.createElement('canvas');gc.width=gc.height=128;
const gt=new T.CanvasTexture(gc);gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.repeat.set(70,70);
const gr=new T.Mesh(new T.PlaneGeometry(540,540),new T.MeshLambertMaterial({map:gt}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;sc.add(gr);
let mp='ile',mode='br',inited=0;
const MAPS={ile:{g:'#5fae4e',h:95,hr:30,s:45,l:35,lr:20,sky:['#2b7bd6','#8ecbff','#e6f4ff'],tc:[0x2e7d32,0x388e3c],tn:150,hn:16},
 desert:{g:'#d9b872',h:38,hr:12,s:50,l:60,lr:12,sky:['#d9822b','#ffd9a0','#fff1d6'],tc:[0xa68a3c,0xb59a4a],tn:45,hn:18},
 neige:{g:'#eef3f8',h:210,hr:10,s:25,l:86,lr:12,sky:['#6a8fb5','#b9cde0','#eef3f8'],tc:[0x2f5d50,0xe8f0f5],tn:120,hn:12}};
function applyMap(k){mp=k;const m=MAPS[k],c=gc.getContext('2d');c.fillStyle=m.g;c.fillRect(0,0,128,128);
 for(let i=0;i<900;i++){c.fillStyle=`hsl(${m.h+Math.random()*m.hr},${m.s}%,${m.l+Math.random()*m.lr}%)`;c.fillRect(Math.random()*128,Math.random()*128,2,2);}gt.needsUpdate=true;
 const x=sk.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,m.sky[0]);g.addColorStop(.6,m.sky[1]);g.addColorStop(1,m.sky[2]);x.fillStyle=g;x.fillRect(0,0,2,256);sc.background.needsUpdate=true;sc.fog.color.set(m.sky[2]);}
applyMap('ile');
const M=c=>new T.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||sc).add(m);return m;}
for(let i=0;i<14;i++){const c=new T.Mesh(new T.SphereGeometry(1,8,6),new T.MeshBasicMaterial({color:0xffffff,fog:false}));c.scale.set(rnd(15,30),3,rnd(8,14));c.position.set(rnd(-250,250),rnd(70,100),rnd(-250,250));sc.add(c);}
// monde
let cols=[],tops=[],blds=[],solid=[],trees=[],chests=[],bots=[],st,P,R=210,R0=210;
function man(c){const g=new T.Group(),L=[];
 for(const s of[-1,1]){const l=new T.Group();l.position.set(s*.2,.8,0);box(.28,.8,.3,0x2d3447,0,-.4,0,l);g.add(l);L.push(l);}
 box(.8,.9,.45,c,0,1.25,0,g);box(.55,.55,.55,0xf2c490,0,2,0,g);box(.62,.25,.62,c,0,2.3,0,g);box(.5,.7,.2,0x3b3b3b,0,1.3,.32,g);
 for(const s of[-1,1])box(.2,.8,.2,c,s*.52,1.3,s>0?0:-.35,g).rotation.x=s>0?0:-1.2;
 box(.15,.2,.9,0x222,.52,1.35,-.6,g);g.userData.legs=L;sc.add(g);return g;}
function init(){const m=MAPS[mp],duel=mode==='duel',sp=duel?30:150,ts=duel?44:235;R0=duel?48:210;R=R0;
 for(let i=0;i<(duel?4:m.hn);i++){const w=rnd(9,14),d=rnd(9,14),x=rnd(-sp,sp),z=rnd(-sp,sp),g=new T.Group();g.position.set(x,0,z);sc.add(g);
  const body=box(w,6,d,[0xe3d3ae,0xc2685a,0x93a9c0][i%3],0,3,0,g);box(w+1.2,.5,d+1.2,0x555a63,0,6.1,0,g);
  for(let k=-1;k<=1;k+=2){box(2,1.8,.2,0x2b3a4a,k*w*.25,3.4,d/2+.05,g);box(2,1.8,.2,0x2b3a4a,k*w*.25,3.4,-d/2-.05,g);}
  box(1.8,3,.3,0x6b4423,0,1.5,d/2+.1,g);
  body.userData.ref={hp:1e9};g.children.forEach(c=>c.userData.ref=body.userData.ref);solid.push(g);cols.push({x,z,hw:w/2,hd:d/2,y0:0,y1:6.4});tops.push({ty:'floor',x,z,hw:w/2+.6,hd:d/2+.6,y0:6.1});
  const c=box(1.4,1,1,0xffc400,x+w/2+2,.5,z);c.material.emissive.set(0x553300);chests.push({m:c,x:x+w/2+2,z,open:0});}
 for(let i=0;i<(duel?14:m.tn);i++){const x=rnd(-ts,ts),z=rnd(-ts,ts),g=new T.Group(),h=rnd(.9,1.4);
  const tr=new T.Mesh(new T.CylinderGeometry(.4,.55,3,6),M(0x6b4423));tr.position.y=1.5;tr.castShadow=true;g.add(tr);
  for(let k=0;k<3;k++){const l=new T.Mesh(new T.ConeGeometry(2.6-k*.6,3.4,7),M(m.tc[k%2]));l.position.y=3.6+k*1.9;l.castShadow=true;g.add(l);}
  g.position.set(x,0,z);g.scale.setScalar(h);sc.add(g);trees.push({x,z,wood:4,g});}
 st=new T.Mesh(new T.CylinderGeometry(1,1,160,64,1,true),new T.MeshBasicMaterial({color:0x8a2be2,transparent:true,opacity:.28,side:T.DoubleSide,fog:false}));st.position.y=60;sc.add(st);
 P={x:duel?0:rnd(-100,100),z:duel?28:rnd(-100,100),y:0,vy:0,hp:100,ammo:duel?150:60,wood:duel?300:100,yaw:0,pitch:.15,cd:0,g:man(0x2f6fdd),hit(){$('fl').style.opacity=.5;setTimeout(()=>$('fl').style.opacity=0,120)}};
 P.g.userData.ref=P;
 for(let i=0;i<(duel?1:19);i++){const b={x:duel?0:rnd(-170,170),z:duel?-28:rnd(-170,170),y:0,hp:DFS[S.diff||0].hp,alive:1,cd:duel?2:rnd(0,2),wt:0,tx:0,tz:0,g:man(duel?0xd32f2f:Math.random()*0xffffff)};b.g.userData.ref=b;bots.push(b);}}
// état
let state='menu',time=0,keys={},down=0,msgT=0,tool=1,piece='wall',jx=0,jy=0,sprint=0,ghost=null,gkey='',walk=0;
const ray=new T.Raycaster();
function fire(o,d,dmg,near,targets,col,far){ray.set(o,d);ray.near=near;ray.far=far||160;const h=ray.intersectObjects(targets,true)[0];
 const p=h?h.point:o.clone().addScaledVector(d,far||160);
 if(h){let ob=h.object;while(ob&&!ob.userData.ref)ob=ob.parent;if(ob){const r=ob.userData.ref;r.hp-=dmg;r.hit&&r.hit();}}
 const l=new T.Line(new T.BufferGeometry().setFromPoints([o,p]),new T.LineBasicMaterial({color:col}));sc.add(l);setTimeout(()=>{sc.remove(l);l.geometry.dispose()},60);}
function mv(e,dx,dz){e.x+=dx;e.z+=dz;const y=e.y||0;
 for(const c of cols){if(y+1.8<=c.y0+.01||y>=c.y1-.3)continue;const cx=Math.max(c.x-c.hw,Math.min(e.x,c.x+c.hw)),cz=Math.max(c.z-c.hd,Math.min(e.z,c.z+c.hd)),d=Math.hypot(e.x-cx,e.z-cz);
 if(d<.6){if(d<1e-4)e.x+=.6;else{e.x+=(e.x-cx)/d*(.6-d);e.z+=(e.z-cz)/d*(.6-d);}}}
 e.x=Math.max(-260,Math.min(260,e.x));e.z=Math.max(-260,Math.min(260,e.z));}
function gh(x,z,y){let h=0;for(const b of tops){if(Math.abs(x-b.x)>b.hw||Math.abs(z-b.z)>b.hd)continue;if(b.st&&Math.abs(x-b.x)<1&&Math.abs(z-b.z)<1)continue;
 const top=b.ty==='ramp'?b.y0+.3+3*Math.max(0,Math.min(1,((x-b.x)*b.dx+(z-b.z)*b.dz+2)/4)):b.y0+.3;if(b.y0>5.9&&b.ty==='floor'&&b.hw>5)continue;
 if(top<=y+.7&&top>h)h=top;}
 for(const b of tops)if(b.hw>5&&Math.abs(x-b.x)<=b.hw&&Math.abs(z-b.z)<=b.hd&&6.1<=y+.7&&6.1>h)h=6.1;return h;}
function say(t){$('msg').textContent=t;msgT=2.5;}
// construction
function spec(ty){const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),qx=P.x+fx*4.5,qz=P.z+fz*4.5,ax=Math.abs(fx)>Math.abs(fz),n=Math.round((P.y-.3)/3);
 const s={ty};
 if(ty==='wall'){s.y0=n*3;if(ax){s.x=Math.round(qx/4)*4;s.z=Math.floor(qz/4)*4+2;s.hw=.15;s.hd=2}else{s.z=Math.round(qz/4)*4;s.x=Math.floor(qx/4)*4+2;s.hw=2;s.hd=.15}}
 else{s.x=Math.floor(qx/4)*4+2;s.z=Math.floor(qz/4)*4+2;s.hw=2;s.hd=2;s.y0=ty==='floor'?(n+1)*3:n*3;s.dx=ax?Math.sign(fx):0;s.dz=ax?0:Math.sign(fz);}
 s.k=[ty,s.x,s.z,s.y0,s.dx,s.dz].join();return s;}
function mk(s,gh_){const mat=gh_?new T.MeshBasicMaterial({color:0x44aaff,transparent:true,opacity:.4}):M(0xc79a5a);let m;

function applySet(){const r=document.documentElement.style;r.setProperty('--bs',S.bsize);r.setProperty('--bo',S.bop);
 cam.fov=S.fov;cam.updateProjectionMatrix();rd.setPixelRatio(S.hq?Math.min(devicePixelRatio,mob?1.5:2):1);rd.setSize(innerWidth,innerHeight);
 rd.shadowMap.enabled=!!S.shadows;sun.castShadow=!!S.shadows;sc.traverse(o=>{if(o.material)o.material.needsUpdate=true});}
function openSet(){paused=1;if(document.pointerLockElement)document.exitPointerLock();$('set').style.display='flex';}
function closeSet(){$('set').style.display='none';paused=0;if(state==='play'){$('ov').style.display='none';if(!mob)rd.domElement.requestPointerLock();}}
$('gear').onclick=openSet;$('sOk').onclick=closeSet;
addEventListener('keydown',e=>{if(e.code==='KeyO'&&$('set').style.display!=='flex')openSet();});
$('sDiff').value=S.diff;$('sDiff').onchange=e=>{S.diff=+e.target.value;save();};
$('sLang').value=S.lang;$('sLang').onchange=e=>{S.lang=+e.target.value;save();applyLang();};
[['sSens','sens'],['sFov','fov'],['sBs','bsize'],['sBo','bop']].forEach(([i,k])=>{const e=$(i);e.value=S[k];e.oninput=()=>{S[k]=+e.value;save();applySet();};});
[['sInv','invY'],['sSh','shadows'],['sHq','hq']].forEach(([i,k])=>{const e=$(i);e.checked=!!S[k];e.onchange=()=>{S[k]=e.checked?1:0;save();applySet();};});
$('sRes').onclick=()=>{S.pos={};save();applyPos();};
if(!mob){$('sLay').style.display=$('sRes').style.display='none';}
$('sLay').onclick=()=>{$('set').style.display='none';layout=1;document.body.classList.add('layout');};
$('lDone').onclick=()=>{layout=0;document.body.classList.remove('layout');openSet();};
document.querySelectorAll('.b').forEach(b=>{
 b.addEventListener('pointerdown',e=>{if(!layout)return;e.preventDefault();drag=b;b.setPointerCapture(e.pointerId);});
 b.addEventListener('pointermove',e=>{if(drag!==b)return;S.pos[b.id]=[Math.max(.04,Math.min(.96,e.clientX/innerWidth)),Math.max(.06,Math.min(.94,e.clientY/innerHeight))];applyPos();});
 b.addEventListener('pointerup',()=>{if(drag===b){drag=null;save();}});});
applyLang();applyPos();applySet();
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'&&!paused&&(mob||document.pointerLockElement))update(dt);
 else if(state==='menu'){if(!lob)lob=man(0x2f6fdd);lob.rotation.y=Math.sin(now/1800)*.7;cam.position.set(0,2.3,7);cam.lookAt(2.4,1.5,0);}
 rd.render(sc,cam);})(last);
</script>
</body>
</html>
