<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FortniteX Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div>Chargement du lobby...</div>
  </div>

  <div id="menu">
    <div class="menu-container">
      <div class="logo">FORTNITEX</div>
      <div class="subtitle">BATTLE ROYALE</div>
      <button class="btn btn-primary" onclick="showAuthScreen()">JOUER</button>
      <button class="btn btn-secondary" onclick="showSettings()">PARAMÈTRES</button>
    </div>
  </div>

  <div id="auth-screen" class="hidden">
    <div class="auth-box">
      <h2 id="auth-title">Connexion</h2>

      <div class="field">
        <label>Pseudo</label>
        <input id="username" type="text" placeholder="Ton pseudo" />
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input id="password" type="password" placeholder="Ton mot de passe" />
      </div>

      <div id="register-email-field" class="field hidden">
        <label>Email</label>
        <input id="email" type="email" placeholder="Ton email" />
      </div>

      <div class="auth-actions">
        <button class="btn btn-primary w-full" id="auth-btn" onclick="authenticate()">Connexion</button>
        <button class="btn btn-ghost w-full" onclick="backToMenu()">Retour</button>
      </div>

      <div class="toggle-auth">
        Pas de compte ? <a onclick="toggleAuthMode()">S'inscrire</a>
      </div>
    </div>
  </div>

  <div id="skin-selection" class="hidden">
    <div class="skin-box">
      <h2>Choisir un skin</h2>
      <div id="skins-grid"></div>
      <button class="btn btn-primary" onclick="startGame()">LANCER LA PARTIE</button>
    </div>
  </div>

  <div id="settings-screen" class="hidden">
    <div class="settings-box">
      <h2>Paramètres</h2>

      <div class="field">
        <label>Sensibilité souris</label>
        <input id="mouse-sensitivity" type="range" min="0.1" max="1.5" step="0.1" value="0.7" />
      </div>

      <div class="field">
        <label>Volume</label>
        <input id="volume" type="range" min="0" max="100" step="10" value="60" />
      </div>

      <button class="btn btn-secondary" onclick="backToMenuFromSettings()">Retour</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="hud-block">
        <div class="hud-label">Joueur</div>
        <div class="hud-value" id="player-name">Joueur</div>
      </div>

      <div class="hud-block">
        <div class="hud-label">Vie</div>
        <div class="health-shell">
          <div id="health-fill"></div>
        </div>
        <div class="hud-value small" id="health-text">100</div>
      </div>

      <div class="hud-block">
        <div class="hud-label">Bouclier</div>
        <div class="shield-shell">
          <div id="shield-fill"></div>
        </div>
        <div class="hud-value small" id="shield-text">0</div>
      </div>

      <div class="hud-block">
        <div class="hud-label">Arme</div>
        <div class="hud-value" id="weapon-name">Fusil</div>
      </div>

      <div class="hud-block">
        <div class="hud-label">Munitions</div>
        <div class="hud-value" id="ammo-text">300</div>
      </div>

      <div class="hud-block">
        <div class="hud-label">Zone</div>
        <div class="hud-value" id="zone-text">100%</div>
      </div>

      <div class="hud-block">
        <div class="hud-label">Classement</div>
        <div class="hud-value" id="rank-text">Bronze</div>
      </div>
    </div>

    <div id="inventory">
      <div class="inventory-title">Armes</div>
      <div id="weapons-container"></div>
      <div class="inventory-title mt">Objets</div>
      <div id="items-container"></div>
    </div>

    <div id="build-menu" class="hidden">
      <div class="build-title">Construction</div>
      <div id="build-buttons"></div>
    </div>

    <div id="ingame-chat">
      <div id="chat-messages"></div>
      <div id="chat-input">
        <input id="chat-box" type="text" placeholder="Taper pour parler..." />
        <button onclick="sendMessage()">Envoyer</button>
      </div>
    </div>

    <div id="scoreboard" class="hidden">
      <div class="scoreboard-title">Classement</div>
      <div id="scoreboard-players"></div>
    </div>

    <div id="friends-panel" class="hidden">
      <div class="friends-header">
        <span>Amis</span>
        <button class="close-btn" onclick="toggleFriendsPanel()">✕</button>
      </div>

      <div class="friend-form">
        <input id="friend-name-input" type="text" placeholder="Ajouter un ami" />
        <button onclick="addFriend()">Ajouter</button>
      </div>

      <div id="friends-list"></div>

      <div class="requests-title">Demandes d'ami</div>
      <div id="friend-requests-list"></div>
    </div>

    <div id="crosshair">
      <div class="cross-line cross-h"></div>
      <div class="cross-line cross-v"></div>
    </div>

    <div id="game-message"></div>
  </div>
</body>
<script src="game.js"></script>
</html>
