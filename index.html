<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Blox Burt</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#07111c}
button{font-family:Arial,sans-serif}

#menu{
 position:fixed;inset:0;z-index:100;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:
 radial-gradient(circle at 50% 35%,rgba(40,170,255,.35),transparent 35%),
 linear-gradient(135deg,#06182b,#092d48 50%,#02070d);
 color:white;
}

.logo{
 font-size:clamp(42px,11vw,78px);
 font-weight:1000;
 letter-spacing:4px;
 text-shadow:0 6px 0 #07365a,0 12px 25px #000;
}
.subtitle{margin:12px 0 40px;opacity:.85;font-size:16px}

#play{
 border:0;border-radius:14px;padding:17px 65px;
 font-size:25px;font-weight:900;color:white;
 background:linear-gradient(#22b7ff,#0872d1);
 box-shadow:0 8px 25px #001b33;
}
#play:active{transform:scale(.95)}

#game{display:none;position:fixed;inset:0;background:#7ed8ff}

canvas{display:block;width:100%;height:100%}

#hud{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;
 color:white;pointer-events:none;
}
.panel{
 background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);
 padding:9px 13px;border-radius:10px;font-weight:bold;
}

#attacks{
 position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
 display:flex;gap:9px;
}
.attack{
 width:58px;height:58px;border-radius:13px;
 border:2px solid white;background:rgba(0,0,0,.65);
 color:white;font-size:21px;font-weight:900;
}
.attack:active{transform:scale(.88);background:#168cff}

#joystick{
 position:absolute;left:22px;bottom:25px;
 width:125px;height:125px;border-radius:50%;
 background:rgba(255,255,255,.14);
 border:2px solid rgba(255,255,255,.35);
}
#stick{
 position:absolute;left:35px;top:35px;
 width:55px;height:55px;border-radius:50%;
 background:rgba(255,255,255,.55);
}

#hint{
 position:absolute;top:72px;left:50%;transform:translateX(-50%);
 color:white;background:rgba(0,0,0,.45);
 padding:7px 12px;border-radius:9px;font-size:13px;
}
</style>
</head>

<body>

<div id="menu">
  <div class="logo">BLOX BURT</div>
  <div class="subtitle">EXPLORE • COMBAT • DEVIENS LE PLUS PUISSANT</div>
  <button id="play">JOUER</button>
</div>

<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="panel">❤️ <span id="hp">100</span>/100</div>
    <div class="panel">💰 <span id="beli">0</span> Beli</div>
  </div>

  <div id="hint">Glisse sur l'écran pour tourner la caméra 360°</div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="attacks">
    <button class="attack" data-power="X">X</button>
    <button class="attack" data-power="Z">Z</button>
    <button class="attack" data-power="C">C</button>
    <button class="attack" data-power="V">V</button>
  </div>
</div>

<script>
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const play=document.getElementById("play");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
canvas.width=W*devicePixelRatio;
canvas.height=H*devicePixelRatio;
ctx.scale(devicePixelRatio,devicePixelRatio);

addEventListener("resize",()=>{
 W=innerWidth;H=innerHeight;
 canvas.width=W*devicePixelRatio;
 canvas.height=H*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
});

let started=false;
let player={x:0,y:0,hp:100};
let camera={angle:0,distance:330};
let keys={};
let attacking=null;
let attackTimer=0;

const islands=[
 {x:-700,y:80,r:190,name:"ÎLE DU DÉPART"},
 {x:-300,y:-480,r:170,name:"ÎLE DES PIRATES"},
 {x:180,y:420,r:210,name:"ÎLE DE LA JUNGLE"},
 {x:650,y:-260,r:185,name:"ÎLE DU VOLCAN"},
 {x:900,y:430,r:220,name:"ÎLE LÉGENDAIRE"}
];

const trees=[
 [-700,40],[-620,110],[-760,120],
 [-300,-510],[-240,-450],
 [150,400],[240,450],[100,480],
 [610,-300],[690,-230],
 [850,400],[950,470],[890,520]
];

play.onclick=()=>{
 menu.style.display="none";
 game.style.display="block";
 started=true;
 requestAnimationFrame(loop);
};

/* Clavier */
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["x","z","c","v"].includes(e.key.toLowerCase()))
   attack(e.key.toUpperCase());
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

/* Caméra 360° tactile */
let touchX=null;
canvas.addEventListener("touchstart",e=>{
 if(e.touches.length){
   touchX=e.touches[0].clientX;
 }
},{passive:true});

canvas.addEventListener("touchmove",e=>{
 if(touchX!==null){
   const x=e.touches[0].clientX;
   camera.angle+=(x-touchX)*0.012;
   touchX=x;
 }
},{passive:true});

canvas.addEventListener("touchend",()=>touchX=null);

/* Souris */
let mouseX=null;
canvas.addEventListener("mousedown",e=>mouseX=e.clientX);
canvas.addEventListener("mousemove",e=>{
 if(mouseX!==null){
   camera.angle+=(e.clientX-mouseX)*0.012;
   mouseX=e.clientX;
 }
});
addEventListener("mouseup",()=>mouseX=null);

/* Attaques */
document.querySelectorAll(".attack").forEach(b=>{
 b.onclick=()=>attack(b.dataset.power);
});

function attack(power){
 if(!started||attacking)return;

 attacking=power;
 attackTimer=22;
}

function update(){
 const speed=4;

 let dx=0,dy=0;

 if(keys["w"]||keys["arrowup"])dy-=1;
 if(keys["s"]||keys["arrowdown"])dy+=1;
 if(keys["a"]||keys["arrowleft"])dx-=1;
 if(keys["d"]||keys["arrowright"])dx+=1;

 /* déplacement relatif à la caméra */
 const ca=Math.cos(camera.angle);
 const sa=Math.sin(camera.angle);

 const mx=dx*ca-dy*sa;
 const my=dx*sa+dy*ca;

 player.x+=mx*speed;
 player.y+=my*speed;

 if(attackTimer>0){
   attackTimer--;
   if(attackTimer===0)attacking=null;
 }
}

/* Dessin */
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

function worldToScreen(x,y){
 const dx=x-player.x;
 const dy=y-player.y;

 const c=Math.cos(-camera.angle);
 const s=Math.sin(-camera.angle);

 const rx=dx*c-dy*s;
 const ry=dx*s+dy*c;

 return {
   x:W/2+rx,
   y:H/2+ry*.72
 };
}

function draw(){
 ctx.clearRect(0,0,W,H);

 /* ciel */
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#5bc7ff");
 sky.addColorStop(.55,"#c5f1ff");
 sky.addColorStop(.56,"#48a6d8");
 sky.addColorStop(1,"#1570a1");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 /* soleil */
 ctx.fillStyle="#fff0a0";
 ctx.beginPath();
 ctx.arc(W-90,80,42,0,Math.PI*2);
 ctx.fill();

 /* mer */
 ctx.fillStyle="#1687bd";
 ctx.fillRect(0,H*.55,W,H*.45);

 /* îles */
 islands.forEach(drawIsland);

 /* arbres */
 trees.forEach(t=>drawTree(t[0],t[1]));

 /* personnage */
 drawPlayer();

 /* attaque */
 if(attacking)drawAttack();

 /* direction */
 drawCrosshair();
}

function drawIsland(i){
 const p=worldToScreen(i.x,i.y);
 const scale=Math.max(.45,1-Math.abs(p.y-H/2)/700);
 const r=i.r*scale;

 ctx.save();

 /* ombre */
 ctx.fillStyle="rgba(0,0,0,.25)";
 ctx.beginPath();
 ctx.ellipse(p.x,p.y+28,r*1.05,r*.45,0,0,Math.PI*2);
 ctx.fill();

 /* sable */
 ctx.fillStyle="#d8b06b";
 ctx.beginPath();
 ctx.ellipse(p.x,p.y,r,r*.55,0,0,Math.PI*2);
 ctx.fill();

 /* herbe */
 ctx.fillStyle="#3e9e42";
 ctx.beginPath();
 ctx.ellipse(p.x,p.y-10,r*.92,r*.48,0,0,Math.PI*2);
 ctx.fill();

 /* nom */
 ctx.fillStyle="white";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.shadowColor="#000";
 ctx.shadowBlur=5;
 ctx.fillText(i.name,p.x,p.y-r*.55);
 ctx.shadowBlur=0;

 ctx.restore();
}

function drawTree(x,y){
 const p=worldToScreen(x,y);
 const s=Math.max(.45,1-Math.abs(p.y-H/2)/700);

 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.scale(s,s);

 /* tronc */
 ctx.fillStyle="#754526";
 ctx.fillRect(-8,-55,16,55);

 /* feuilles */
 ctx.fillStyle="#176b2d";
 ctx.beginPath();
 ctx.arc(0,-70,34,0,Math.PI*2);
 ctx.arc(-22,-55,25,0,Math.PI*2);
 ctx.arc(22,-55,25,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawPlayer(){
 const x=W/2;
 const y=H*.57;

 ctx.save();
 ctx.translate(x,y);

 let bob=Math.sin(Date.now()/120)*2;

 if(attacking){
   ctx.rotate(Math.sin(attackTimer/3)*.12);
 }

 /* ombre */
 ctx.fillStyle="rgba(0,0,0,.3)";
 ctx.beginPath();
 ctx.ellipse(0,42,28,10,0,0,Math.PI*2);
 ctx.fill();

 /* jambes */
 ctx.fillStyle="#17243a";
 ctx.fillRect(-18,25,14,32);
 ctx.fillRect(4,25,14,32);

 /* chaussures */
 ctx.fillStyle="#111";
 ctx.fillRect(-21,52,19,9);
 ctx.fillRect(2,52,19,9);

 /* corps */
 const body=ctx.createLinearGradient(-20,-5,20,30);
 body.addColorStop(0,"#23a8ff");
 body.addColorStop(1,"#07539b");
 ctx.fillStyle=body;
 ctx.fillRect(-22,-15,44,45);

 /* bras */
 ctx.fillStyle="#b8754d";
 ctx.fillRect(-34,-10,11,39);
 ctx.fillRect(23,-10,11,39);

 /* mains */
 ctx.beginPath();
 ctx.arc(-29,31,7,0,Math.PI*2);
 ctx.arc(29,31,7,0,Math.PI*2);
 ctx.fill();

 /* cou */
 ctx.fillStyle="#b8754d";
 ctx.fillRect(-7,-25,14,12);

 /* tête */
 const skin=ctx.createLinearGradient(-19,-55,19,-20);
 skin.addColorStop(0,"#d99a69");
 skin.addColorStop(1,"#a9613d");
 ctx.fillStyle=skin;
 ctx.beginPath();
 ctx.arc(0,-45,22,0,Math.PI*2);
 ctx.fill();

 /* cheveux */
 ctx.fillStyle="#16120f";
 ctx.beginPath();
 ctx.arc(0,-56,22,Math.PI,Math.PI*2);
 ctx.fill();
 ctx.fillRect(-21,-58,42,10);

 /* yeux */
 ctx.fillStyle="white";
 ctx.fillRect(-12,-48,7,5);
 ctx.fillRect(5,-48,7,5);

 ctx.fillStyle="#111";
 ctx.fillRect(-9,-47,3,3);
 ctx.fillRect(8,-47,3,3);

 /* bouche */
 ctx.strokeStyle="#542719";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,-38,7,0.2,Math.PI-.2);
 ctx.stroke();

 ctx.restore();
}

function drawAttack(){
 const x=W/2+Math.sin(Date.now()/80)*5;
 const y=H*.57;

 const colors={
  X:"#ffffff",
  Z:"#36b7ff",
  C:"#a05cff",
  V:"#ffbd35"
 };

 ctx.save();
 ctx.strokeStyle=colors[attacking];
 ctx.shadowColor=colors[attacking];
 ctx.shadowBlur=25;
 ctx.lineWidth=9;

 const size=45+(22-attackTimer)*3;

 ctx.beginPath();
 ctx.arc(x,y-10,size,-1.2,1.2);
 ctx.stroke();

 ctx.restore();

 /* texte */
 ctx.fillStyle=colors[attacking];
 ctx.font="bold 28px Arial";
 ctx.textAlign="center";
 ctx.shadowColor="#000";
 ctx.shadowBlur=6;
 ctx.fillText("ATTAQUE "+attacking,W/2,H*.34);
 ctx.shadowBlur=0;
}

function drawCrosshair(){
 ctx.strokeStyle="rgba(255,255,255,.4)";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(W/2-8,H/2);ctx.lineTo(W/2+8,H/2);
 ctx.moveTo(W/2,H/2-8);ctx.lineTo(W/2,H/2+8);
 ctx.stroke();
}

/* Joystick */
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joy={x:0,y:0,active:false};

joystick.addEventListener("touchstart",e=>{
 joy.active=true;
},{passive:true});

joystick.addEventListener("touchmove",e=>{
 if(!joy.active)return;

 const r=joystick.getBoundingClientRect();
 const t=e.touches[0];

 let x=t.clientX-(r.left+r.width/2);
 let y=t.clientY-(r.top+r.height/2);

 const max=42;
 const d=Math.hypot(x,y);

 if(d>max){
   x=x/d*max;
   y=y/d*max;
 }

 stick.style.transform=`translate(${x}px,${y}px)`;

 const ca=Math.cos(camera.angle);
 const sa=Math.sin(camera.angle);

 player.x+=(x/max*4)*ca-(y/max*4)*sa;
 player.y+=(x/max*4)*sa+(y/max*4)*ca;
},{passive:true});

addEventListener("touchend",()=>{
 joy.active=false;
 stick.style.transform="translate(0,0)";
});

</script>
</body>
</html>
