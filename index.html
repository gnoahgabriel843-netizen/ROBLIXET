 const g=new THREE.Group();

  );

  leaves.castShadow=true;

  g.add(leaves);
 }

 g.position.set(x,0,z);
 g.scale.setScalar(s);

 group.add(g);
}

 attacking=true;

 rightArm.rotation.z=-.5;

 const slash=new THREE.Mesh(
  new THREE.TorusGeometry(

  const d=

 if(usingPower)return;

 usingPower=true;

 const radius=12;

 wave.position.copy(player.position);
 wave.position.y+=5;

 scene.add(wave);

 enemies.forEach(e=>{

  if(e.dead)return;

  const d=
   e.mesh.getWorldPosition(
    new THREE.Vector3()
   ).distanceTo(player.position);

   damageEnemy(e,120);
  }
 });

 if(boss){

  const p=

    new THREE.Vector3()

 setTimeout(()=>{

function damageEnemy(enemy,amount){

 enemy.hp-=amount;

 enemy.mesh.scale.set(
 1.2,.8,1.2
 );

 setTimeout(()=>{
  enemy.mesh.scale.set(
   1,1,1
  );
 },150);

 if(enemy.hp<=0){

  enemy.dead=true;
  enemy.mesh.visible=false;

  money+=50;
  xp+=40;
  questKills++;

  message("💰 +50 Beli   ⭐ +40 XP");

  updateUI();

  if(questKills>=3&&!questDone){

   questDone=true;

   money+=500;
   xp+=100;

   message(
    "📜 QUÊTE TERMINÉE ! +500 Beli"
   );

   updateUI();
  }

  checkLevel();
 }
}

  );

 ).style.width=

/* =====================================================
   MOBILE
===================================================== */

const stick=
 document.getElementById("stick");

const knob=
 document.getElementById("knob");

let joyX=0;
let joyY=0;

stick.addEventListener(
 "touchstart",
 e=>{
  updateJoy(e.touches[0]);
 },
 {passive:false}
);

stick.addEventListener(
 "touchmove",
 e=>{
  e.preventDefault();
  updateJoy(e.touches[0]);
 },
 {passive:false}
);

stick.addEventListener(
 "touchend",
 ()=>{
  joyX=0;
  joyY=0;

  knob.style.transform=
   "translate(0,0)";
 }
);

function updateJoy(t){

 const r=
  stick.getBoundingClientRect();

 let x=
  t.clientX-
  (r.left+r.width/2);

 let y=
  t.clientY-
  (r.top+r.height/2);

 const max=45;

 const len=Math.hypot(x,y);

 if(len>max){

  x=x/len*max;
  y=y/len*max;
 }

 joyX=x/max;
 joyY=y/max;

 knob.style.transform=
  `translate(${x}px,${y}px)`;
}


document.getElementById(
 "attack"
).addEventListener(
 "touchstart",

);

   SAUT
===================================================== */

let verticalSpeed=0;
let grounded=true;

function jump(){

 if(!grounded)return;

 verticalSpeed=.3;
 grounded=false;
}


/* =====================================================
   CHANGEMENT D'ÎLE
===================================================== */

function checkIsland(){

 const x=player.position.x;
 const z=player.position.z;

 const d1=Math.hypot(x,z);

 const d2=
  Math.hypot(
   x-100,
   z+30
  );

 const d3=
  Math.hypot(
   x+100,
   z-50
  );

 let newIsland=0;

 if(d2<35)newIsland=1;
 if(d3<35)newIsland=2;

 if(newIsland!==currentIsland){

  currentIsland=newIsland;

  const names=[
   "Départ",
   "Pirate",
   "Volcan"
  ];

  document.getElementById(
   "islandName"
  ).textContent=
   names[newIsland];

  message(
   "🏝️ Île : "+names[newIsland]
  );
 }
}


/* =====================================================
   ANIMATION
===================================================== */

let clock=0;

function animate(){

 requestAnimationFrame(animate);

 clock+=.016;

 let x=0;
 let z=0;

 if(keys["w"]||keys["arrowup"])z-=1;
 if(keys["s"]||keys["arrowdown"])z+=1;
 if(keys["a"]||keys["arrowleft"])x-=1;
 if(keys["d"]||keys["arrowright"])x+=1;

 x+=joyX;
 z+=joyY;

 const moving=
  Math.hypot(x,z)>.1;

 if(moving){

  const len=Math.hypot(x,z);

  x/=len;
  z/=len;

  const speed=.17;

  player.position.x+=
   x*speed;

  player.position.z+=
   z*speed;

  player.rotation.y=
   Math.atan2(x,z);

  const walk=
   Math.sin(clock*11);

  leftLeg.rotation.x=
   walk*.55;

  rightLeg.rotation.x=
   -walk*.55;

  leftArm.rotation.x=
   -walk*.45;

  rightArm.rotation.x=
   walk*.45;

 }else{

  leftLeg.rotation.x*=.8;
  rightLeg.rotation.x*=.8;

  leftArm.rotation.x*=.8;
  rightArm.rotation.x*=.8;
 }


 /* saut */

 verticalSpeed-=.012;

 player.position.y+=
  verticalSpeed;

 if(player.position.y<=4){

  player.position.y=4;
  verticalSpeed=0;
  grounded=true;
 }


 /* ennemis suivent le joueur */

 enemies.forEach(e=>{

  if(e.dead)return;

  const pos=
   e.mesh.getWorldPosition(
    new THREE.Vector3()
   );

  const d=
   pos.distanceTo(
    player.position
   );
