function wsURL(){if(S.srv)return S.srv;if(!window.claude&&/^https?:$/.test(location.protocol)&&location.host)return(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';return null;}
function wsConnect(url,code){return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(url);}catch(e){return rej(e);}const to=setTimeout(()=>{try{ws.close();}catch(e){}rej(new Error('timeout'));},5000);
 const rm={ws,my:null,pm:{},cbs:[],peers(){return Object.keys(this.pm).map(id=>({peer:id,presence:this.pm[id],isMe:id===this.my,sameTab:id===this.my,kind:'viewer'}));},presence(d){if(ws.readyState===1)ws.send(JSON.stringify({t:'p',d}));},onPeers(cb){this.cbs.push(cb);return()=>{this.cbs=this.cbs.filter(f=>f!==cb);};},leave(){try{ws.close();}catch(e){}}};
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:code}));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}if(m.t==='welcome'){rm.my=m.id;clearTimeout(to);res(rm);}else if(m.t==='snap'){rm.pm=m.peers;rm.cbs.forEach(f=>f({peers:rm.peers()}));}else if(m.t==='full'){clearTimeout(to);rej(new Error('full'));}};
 ws.onclose=()=>{rm.pm={};rm.cbs.forEach(f=>f({peers:[]}));};ws.onerror=()=>{clearTimeout(to);rej(new Error('ws'));};});}

 if(u){try{rm=await wsConnect(u,'g'+code);}catch(e){}}if(!rm&&roomL){try{rm=await roomL.join('g-'+code);}catch(e){}}
 if(!rm){smsg(tr(['Aucun serveur joignable — joue avec des bots','No server reachable — play with bots','Sin servidor — juega con bots']));return;}
 mp2={code,rm,started:0};rm.presence({n:S.nm,sk:S.eq.c,pk:S.eq.p,gs:S.eq.g,gl:S.eq.l});mp2.un=rm.onPeers(()=>mpUpdate());mpUpdate();}
