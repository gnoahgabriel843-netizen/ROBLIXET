 for(const dr of doors){const near=(!P.air&&Math.hypot(P.x-dr.x,P.z-dr.z)<4.5)||bots.some(b=>b.alive&&!b.air&&Math.hypot(b.x-dr.x,b.z-dr.z)<4);if(near!==!!dr.open){dr.open=near?1:0;const i=cols.indexOf(dr.col);if(near){if(i>=0)cols.splice(i,1);}else if(i<0)cols.push(dr.col);}dr.ang+=((dr.open?-1.7:0)-dr.ang)*Math.min(1,dt*8);dr.piv.rotation.y=dr.ang*dr.s;}
